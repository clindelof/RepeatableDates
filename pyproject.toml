[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repeatable-dates"
version = "0.1.0"
description = "A small, dependency-free Python library for generating recurring dates."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Christopher Lindelof" }]
keywords = ["calendar", "dates", "recurrence", "scheduling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
